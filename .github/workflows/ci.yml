name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - if: hashFiles('src/app/layout.tsx') != ''
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - id: has
        run: echo "e2e=$(ls e2e/*.spec.ts >/dev/null 2>&1 && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.e2e == 'yes'
        run: bunx playwright install --with-deps chromium
      - if: steps.has.outputs.e2e == 'yes'
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
